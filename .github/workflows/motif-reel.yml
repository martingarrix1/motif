name: MOTIF 릴스 렌더링

# reels/<작업명>/reel.json 을 올리면(깃허브 앱 → Add file) 자동으로 릴스를 만든다.
# 완성본은 Releases에 mp4로 올라간다(휴대폰에서 바로 받기).
on:
  push:
    branches: [smartstore-assets]
    paths: ["reels/**/reel.json"]
  workflow_dispatch:
    inputs:
      job_dir: { description: "작업 폴더 (예: reels/tesla_pkg_v1)", required: true }
      draft: { description: "빠른 초안 화질", type: boolean, default: false }

permissions:
  contents: write

concurrency: { group: motif-reel, cancel-in-progress: false }

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: smartstore-assets, fetch-depth: 2 }

      - name: 작업 폴더 찾기
        id: j
        run: |
          if [ -n "${{ github.event.inputs.job_dir }}" ]; then D="${{ github.event.inputs.job_dir }}"
          else D=$(dirname "$(git diff --name-only HEAD~1 HEAD | grep 'reel.json$' | head -n1)"); fi
          [ -f "$D/reel.json" ] || { echo "reel.json 없음: $D"; exit 1; }
          echo "dir=$D" >> "$GITHUB_OUTPUT"; echo "name=$(basename "$D")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra >/dev/null
          pip install -q --break-system-packages fonttools brotli numpy
          curl -sSL https://raw.githubusercontent.com/martingarrix1/motif/smartstore-assets/flow/kit/bootstrap.sh | sh -s "$HOME/mk"
          test -f "$HOME/mk/textkit/hfkit/hfkit.py"

      - name: 키 넣기
        env:
          ELEVEN: ${{ secrets.ELEVENLABS_API_KEY }}
          GEM: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$ELEVEN" ] || { echo "깃허브 설정에 ELEVENLABS_API_KEY가 없습니다"; exit 1; }
          mkdir -p ~/.eleven ~/.gemini
          printf '%s' "$ELEVEN" > ~/.eleven/key
          printf '%s' "$GEM" > ~/.gemini/key

      - name: 릴스 만들기
        env: { DO_NOT_TRACK: "1" }
        run: python3 flow/gemini/run_reel.py "${{ steps.j.outputs.dir }}" ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}

      - name: 완성본 올리기(Releases)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          D="${{ steps.j.outputs.dir }}"; N="${{ steps.j.outputs.name }}"; TAG="reel-$N-${{ github.run_number }}"
          gh release create "$TAG" "$D/$N.mp4" --target smartstore-assets --title "릴스 $N (#${{ github.run_number }})" --notes "reel.json: $D" --prerelease
          echo "받기: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.j.outputs.name }}-work
          path: |
            ${{ steps.j.outputs.dir }}/spec.py
            ${{ steps.j.outputs.dir }}/timing.json
            ${{ steps.j.outputs.dir }}/vo/say.json
          if-no-files-found: ignore
